<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cruz Control Coaching</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Serif+4:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0f1e;font-family:'Source Serif 4',Georgia,serif;color:#f0ede6;min-height:100vh}
.bebas{font-family:'Bebas Neue',sans-serif}
.header{background:linear-gradient(180deg,#0d1428 0%,#0a0f1e 100%);border-bottom:1px solid rgba(201,168,76,0.2);padding:20px 24px;display:flex;align-items:center;gap:16px}
.logo-circle{width:44px;height:44px;background:linear-gradient(135deg,#C9A84C,#b8902a);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.bio-section{background:linear-gradient(180deg,#0d1428 0%,#091020 100%);border-bottom:1px solid rgba(255,255,255,0.06);padding:28px 24px}
.bio-inner{max-width:680px;margin:0 auto;display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.bio-photo{width:120px;height:155px;object-fit:cover;object-position:top;border-radius:10px;border:2px solid rgba(201,168,76,0.3);flex-shrink:0}
.tag{background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.22);border-radius:20px;padding:3px 10px;font-size:0.68rem;color:#C9A84C;font-family:'Bebas Neue',sans-serif;letter-spacing:0.05em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.main{max-width:680px;margin:0 auto;padding:32px 20px}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:20px;cursor:pointer;transition:all 0.2s;display:flex;gap:16px;align-items:flex-start;margin-bottom:12px}
.card:hover,.card.selected{border-color:#C9A84C;background:rgba(201,168,76,0.08)}
.btn{background:#C9A84C;color:#0a0f1e;border:none;border-radius:8px;padding:14px 32px;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.2s}
.btn:hover{background:#e0c060}
.btn:disabled{background:#333;color:#666;cursor:not-allowed}
.btn-ghost{background:transparent;color:#aaa;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:12px 24px;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.08em;cursor:pointer;transition:all 0.2s}
.btn-ghost:hover{border-color:#C9A84C;color:#C9A84C}
.chip{border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 14px;background:transparent;color:#bbb;cursor:pointer;font-size:0.8rem;text-align:center;min-width:70px;transition:all 0.15s;display:inline-block}
.chip:hover,.chip.selected{border-color:#C9A84C;background:rgba(201,168,76,0.15);color:#C9A84C}
.time-chip{border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:10px 16px;background:transparent;color:#ccc;cursor:pointer;font-size:0.85rem;transition:all 0.15s}
.time-chip:hover,.time-chip.selected{border-color:#C9A84C;background:rgba(201,168,76,0.15);color:#C9A84C;font-weight:600}
input,select,textarea{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:12px 16px;color:#f0ede6;font-family:'Source Serif 4',serif;font-size:0.95rem;width:100%;outline:none;transition:border-color 0.2s;margin-bottom:0}
input:focus,select:focus,textarea:focus{border-color:#C9A84C}
select option{background:#1a1f35}
label{display:block;font-size:0.75rem;letter-spacing:0.1em;color:#888;text-transform:uppercase;margin-bottom:6px;font-family:'Bebas Neue',sans-serif}
.field{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step-row{display:flex;align-items:center;gap:8px;margin-bottom:36px}
.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-family:'Bebas Neue',sans-serif;flex-shrink:0}
.step-line{flex:1;height:1px;background:rgba(255,255,255,0.1)}
.step-line.done{background:#C9A84C}
.summary-box{background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.25);border-radius:10px;padding:16px 20px;margin-bottom:16px}
.error-box{background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.3);border-radius:8px;padding:12px 16px;margin-top:16px;color:#ff8080;font-size:0.88rem}
.empty-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:32px;text-align:center}
.confirm-box{background:rgba(201,168,76,0.07);border:1px solid rgba(201,168,76,0.25);border-radius:12px;padding:24px 28px;display:inline-block;text-align:left;min-width:280px}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-12px)}}
.bounce{animation:bounce 0.6s ease infinite alternate;display:inline-block}
::placeholder{color:#555}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.flex-end{display:flex;justify-content:flex-end}
.date-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.time-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* ADMIN */
.admin-header{background:#0d1428;border-bottom:1px solid rgba(201,168,76,0.2);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.tab-bar{border-bottom:1px solid rgba(255,255,255,0.06);display:flex;padding:0 20px}
.tab{padding:10px 20px;background:transparent;border:none;border-bottom:2px solid transparent;color:#888;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.2s}
.tab.active{color:#C9A84C;border-bottom-color:#C9A84C}
.slot-btn{border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 12px;background:transparent;color:#777;cursor:pointer;font-size:0.78rem;transition:all 0.15s;min-width:80px}
.slot-btn.on{border-color:#C9A84C;background:rgba(201,168,76,0.15);color:#C9A84C;font-weight:600}
.day-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:16px;margin-bottom:12px}
.booking-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:18px;margin-bottom:12px}
.badge{padding:3px 10px;border-radius:20px;font-size:0.7rem;font-family:'Bebas Neue',sans-serif;letter-spacing:0.08em}
.badge-pending{background:rgba(255,200,0,0.15);color:#ffc800;border:1px solid rgba(255,200,0,0.3)}
.badge-confirmed{background:rgba(80,200,120,0.15);color:#50c878;border:1px solid rgba(80,200,120,0.3)}
.badge-cancelled{background:rgba(255,80,80,0.1);color:#ff8080;border:1px solid rgba(255,80,80,0.2)}
.msg-bar{padding:10px 20px;font-size:0.85rem;text-align:center}
.msg-success{background:rgba(80,200,120,0.1);border-bottom:1px solid rgba(80,200,120,0.3);color:#50c878}
.msg-error{background:rgba(255,80,80,0.1);border-bottom:1px solid rgba(255,80,80,0.3);color:#ff8080}
.type-toggle{display:flex;gap:8px;margin-bottom:20px}
.type-btn{background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:8px 20px;color:#888;font-family:'Bebas Neue',sans-serif;font-size:0.95rem;letter-spacing:0.08em;cursor:pointer}
.type-btn.active{border-color:#C9A84C;background:rgba(201,168,76,0.15);color:#C9A84C}
.small-btn{background:transparent;border-radius:6px;padding:4px 10px;font-family:'Bebas Neue',sans-serif;font-size:0.7rem;cursor:pointer}
.small-btn-gold{border:1px solid rgba(201,168,76,0.3);color:#C9A84C}
.small-btn-grey{border:1px solid rgba(255,255,255,0.1);color:#777}
.status-select{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:4px 8px;color:#f0ede6;font-size:0.78rem;outline:none;width:auto}
.pin-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
.pin-card{background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,0.2);border-radius:16px;padding:40px;width:100%;max-width:340px;text-align:center}
.pin-input{background:rgba(255,255,255,0.05);border-radius:8px;padding:14px 16px;color:#f0ede6;font-size:1.2rem;letter-spacing:0.3em;text-align:center;width:100%;outline:none;margin-bottom:12px;border:1px solid rgba(255,255,255,0.12)}
.pin-input.error{border-color:#ff6060}
</style>
</head>

async function sb(path,opts={}){
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{
    headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=representation",...(opts.headers||{})},
    ...opts
  });
  if(!r.ok){const e=await r.text();throw new Error(e);}
  const t=await r.text();return t?JSON.parse(t):[];
}

function getDates(start,count){
  const dates=[];const today=new Date();
  for(let i=start;i<start+count+10;i++){
    if(dates.length>=count)break;
    const d=new Date(today);d.setDate(today.getDate()+i);
    dates.push(d);
  }
  return dates;
}
function toDateStr(d){return d.toISOString().split("T")[0];}
function fmtDate(ds){return new Date(ds+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});}
function fmtDateLong(ds){return new Date(ds+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});}

function el(tag,props,children){
  const e=document.createElement(tag);
  if(props)Object.entries(props).forEach(([k,v])=>{
    if(k==="className")e.className=v;
    else if(k==="style")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c==null||c===false)return;
      e.appendChild(typeof c==="string"?document.createTextNode(c):c);
    });
  }
  return e;
}
function div(cls,children,style){return el("div",{className:cls,style:style||{}},children);}
function text(content,style){const s=el("span",{style:style||{}});s.textContent=content;return s;}

function BookingApp(){
  let step=1,session=null,date=null,time=null,availability=[],submitting=false;
  let form={name:"",email:"",phone:"",player:"",age:"",level:"",notes:""};
  const dates=getDates(1,28);
  const app=document.getElementById("app");

  function render(){
    app.innerHTML="";
    app.appendChild(renderHeader());
    app.appendChild(renderBio());
    const main=el("div",{className:"main"});
    if(step<=3)main.appendChild(renderSteps());
    if(step===1)main.appendChild(renderStep1());
    if(step===2)main.appendChild(renderStep2());
    if(step===3)main.appendChild(renderStep3());
    if(step===4)main.appendChild(renderConfirm());
    app.appendChild(main);
  }

  function renderSteps(){
    const labels=["Session","Schedule","Details"];
    const row=el("div",{className:"step-row"});
    labels.forEach((label,i)=>{
      const n=i+1,done=step>n,active=step===n;
      const dot=el("div",{className:"step-dot",style:{
        background:done?"#C9A84C":active?"rgba(201,168,76,0.2)":"rgba(255,255,255,0.05)",
        border:"1px solid "+(done||active?"#C9A84C":"rgba(255,255,255,0.1)"),
        color:done?"#0a0f1e":active?"#C9A84C":"#555"
      }});
      dot.textContent=done?"\u2713":String(n);
      const lbl=el("span",{style:{fontSize:"0.65rem",letterSpacing:"0.1em",color:active?"#C9A84C":"#555",fontFamily:"'Bebas Neue',sans-serif"}});
      lbl.textContent=label;
      const col=el("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:"4px"}},[dot,lbl]);
      const wrap=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",flex:i<2?"1":"none"}},[col]);
      if(i<2){const line=el("div",{className:"step-line"+(done?" done":"")});wrap.appendChild(line);}
      row.appendChild(wrap);
    });
    return row;
  }

  function renderStep1(){
    const wrap=el("div",{});
    const h=el("div",{className:"bebas",style:{fontSize:"2rem",letterSpacing:"0.08em",marginBottom:"6px"}});h.textContent="Choose Your Session";
    const p=el("p",{style:{color:"#888",fontSize:"0.9rem",marginBottom:"24px"}});p.textContent="Select the training format that\u2019s right for your player.";
    wrap.appendChild(h);wrap.appendChild(p);
    SESSIONS.forEach(s=>{
      const card=el("div",{className:"card"+(session===s.id?" selected":"")});
      const icon=el("div",{style:{fontSize:"1.8rem",lineHeight:"1"}});icon.textContent=s.icon;
      const titleRow=el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:"4px"}});
      const lbl=el("span",{className:"bebas",style:{fontSize:"1.2rem",letterSpacing:"0.06em",color:session===s.id?"#C9A84C":"#f0ede6"}});lbl.textContent=s.label;
      const pr=el("span",{style:{color:"#C9A84C",fontSize:"0.9rem",fontWeight:"600"}});pr.textContent=s.price;
      titleRow.appendChild(lbl);titleRow.appendChild(pr);
      const dur=el("div",{style:{fontSize:"0.8rem",color:"#888",marginBottom:"6px"}});dur.textContent="\u23f1 "+s.duration;
      const desc=el("div",{style:{fontSize:"0.85rem",color:"#aaa"}});desc.textContent=s.desc;
      const info=el("div",{style:{flex:"1"}},[titleRow,dur,desc]);
      card.appendChild(icon);card.appendChild(info);
      card.addEventListener("click",()=>{session=s.id;render();});
      wrap.appendChild(card);
    });
    const nextBtn=el("button",{className:"btn"});nextBtn.textContent="Next: Pick a Time \u2192";
    nextBtn.disabled=!session;
    nextBtn.addEventListener("click",()=>{
      if(!session)return;
      step=2;
      loadAvailability();
    });
    const footer=el("div",{className:"flex-end",style:{marginTop:"28px"}});
    footer.appendChild(nextBtn);wrap.appendChild(footer);
    return wrap;
  }

  async function loadAvailability(){
    render();
    const ds=dates.map(toDateStr);
    try{
      availability=await sb("availability?date=in.("+ds.join(",")+")"+"&session_type=eq."+session+"&is_available=eq.true&select=date,time&order=date,time");
    }catch(e){availability=[];}
    render();
  }

  function renderStep2(){
    const wrap=el("div",{});
    const h=el("div",{className:"bebas",style:{fontSize:"2rem",letterSpacing:"0.08em",marginBottom:"6px"}});h.textContent="Pick Your Date & Time";
    const sess=SESSIONS.find(s=>s.id===session);
    const p=el("p",{style:{color:"#888",fontSize:"0.9rem",marginBottom:"24px"}});p.textContent="Showing Cruz\u2019s available slots for "+(sess?sess.label:"");
    wrap.appendChild(h);wrap.appendChild(p);

    const availDates=[...new Set(availability.map(a=>a.date))];
    if(availability.length===0&&date===null){
      const empty=el("div",{className:"empty-box"});
      empty.innerHTML="<div style=\"font-size:2rem;margin-bottom:12px\">\ud83d\udcc5</div><div class=\"bebas\" style=\"font-size:1.2rem;color:#C9A84C;margin-bottom:8px\">No Availability Yet</div><p style=\"color:#888;font-size:0.85rem\">Cruz hasn\u2019t added open slots yet. Check back soon.</p>";
      wrap.appendChild(empty);
    } else {
      const dlbl=el("label");dlbl.textContent="Available Dates";
      wrap.appendChild(dlbl);
      const dateGrid=el("div",{className:"date-grid"});
      availDates.forEach(ds=>{
        const d=new Date(ds+"T12:00:00");
        const chip=el("div",{className:"chip"+(date===ds?" selected":"")});
        chip.innerHTML="<div style=\"font-family:\'Bebas Neue\',sans-serif;font-size:0.72rem;letter-spacing:0.08em\">"+d.toLocaleDateString("en-US",{weekday:"short"})+"</div><div style=\"font-weight:600;font-size:0.95rem\">"+d.getDate()+"</div><div style=\"font-size:0.68rem;opacity:0.7\">"+d.toLocaleDateString("en-US",{month:"short"})+"</div>";
        chip.addEventListener("click",()=>{date=ds;time=null;render();});
        dateGrid.appendChild(chip);
      });
      wrap.appendChild(dateGrid);

      if(date){
        const times=availability.filter(a=>a.date===date).map(a=>a.time);
        const tlbl=el("label",{style:{marginTop:"24px",display:"block"}});tlbl.textContent="Time Slot";
        wrap.appendChild(tlbl);
        const timeGrid=el("div",{className:"time-grid"});
        times.forEach(t=>{
          const btn=el("button",{className:"time-chip"+(time===t?" selected":"")});
          btn.textContent=t;
          btn.addEventListener("click",()=>{time=t;render();});
          timeGrid.appendChild(btn);
        });
        wrap.appendChild(timeGrid);
      }
    }

    if(date&&time){
      const sess=SESSIONS.find(s=>s.id===session);
      const box=el("div",{className:"summary-box",style:{marginTop:"20px"}});
      box.innerHTML="<div class=\"bebas\" style=\"font-size:0.7rem;letter-spacing:0.15em;color:#C9A84C;margin-bottom:4px\">YOUR BOOKING</div><div style=\"color:#f0ede6;font-size:0.95rem\">"+(sess?sess.label:"")+" \u00b7 "+fmtDateLong(date)+" \u00b7 "+time+"</div><div style=\"color:#888;font-size:0.82rem;margin-top:2px\">"+(sess?sess.duration+"  \u00b7 "+sess.price:"")+"</div>";
      wrap.appendChild(box);
    }

    const footer=el("div",{className:"flex-between",style:{marginTop:"28px"}});
    const back=el("button",{className:"btn-ghost"});back.textContent="\u2190 Back";
    back.addEventListener("click",()=>{step=1;render();});
    const next=el("button",{className:"btn"});next.textContent="Next: Your Info \u2192";
    next.disabled=!date||!time;
    next.addEventListener("click",()=>{if(date&&time){step=3;render();}});
    footer.appendChild(back);footer.appendChild(next);
    wrap.appendChild(footer);
    return wrap;
  }

  function renderStep3(){
    const wrap=el("div",{});
    const h=el("div",{className:"bebas",style:{fontSize:"2rem",letterSpacing:"0.08em",marginBottom:"6px"}});h.textContent="Your Information";
    const p=el("p",{style:{color:"#888",fontSize:"0.9rem",marginBottom:"24px"}});p.textContent="Almost done \u2014 tell us about you and your player.";
    wrap.appendChild(h);wrap.appendChild(p);

    function field(lbl,key,type,placeholder){
      const d=el("div",{className:"field"});
      const l=el("label");l.textContent=lbl;
      const inp=el("input",{type:type||"text",placeholder:placeholder||""});
      inp.value=form[key]||"";
      inp.addEventListener("input",e=>{form[key]=e.target.value;});
      d.appendChild(l);d.appendChild(inp);return d;
    }

    const g1=el("div",{className:"grid2"});
    g1.appendChild(field("Parent / Guardian *","name","text","Jane Smith"));
    g1.appendChild(field("Email *","email","email","jane@email.com"));
    wrap.appendChild(g1);
    const g2=el("div",{className:"grid2"});
    g2.appendChild(field("Phone","phone","text","(541) 555-0100"));
    g2.appendChild(field("Player Name *","player","text","Alex Smith"));
    wrap.appendChild(g2);
    const g3=el("div",{className:"grid2"});
    g3.appendChild(field("Player Age","age","text","e.g. 13"));

    const levelField=el("div",{className:"field"});
    const ll=el("label");ll.textContent="Skill Level *";
    const sel=el("select");
    const opt0=el("option");opt0.value="";opt0.textContent="Select level\u2026";sel.appendChild(opt0);
    LEVELS.forEach(l=>{const o=el("option");o.value=l;o.textContent=l;sel.appendChild(o);});
    sel.value=form.level||"";
    sel.addEventListener("change",e=>{form.level=e.target.value;});
    levelField.appendChild(ll);levelField.appendChild(sel);
    g3.appendChild(levelField);
    wrap.appendChild(g3);

    const notesField=el("div",{className:"field"});
    const nl=el("label");nl.textContent="Goals / Notes for Cruz";
    const ta=el("textarea",{rows:"3",placeholder:"What areas to focus on? Any injuries to know about?"});
    ta.value=form.notes||"";
    ta.addEventListener("input",e=>{form.notes=e.target.value;});
    notesField.appendChild(nl);notesField.appendChild(ta);
    wrap.appendChild(notesField);

    const sess=SESSIONS.find(s=>s.id===session);
    const box=el("div",{className:"summary-box"});
    box.innerHTML="<div class=\"bebas\" style=\"font-size:0.7rem;letter-spacing:0.15em;color:#C9A84C;margin-bottom:8px\">BOOKING SUMMARY</div><div style=\"font-size:0.88rem;color:#ccc\">\ud83d\udccb "+(sess?sess.label:"")+"<br>\ud83d\udcc5 "+fmtDateLong(date)+" at "+time+"<br>\ud83d\udcb0 "+(sess?sess.price:"")+"</div>";
    wrap.appendChild(box);

    const errDiv=el("div",{id:"err-msg",style:{display:"none"}});
    errDiv.className="error-box";
    wrap.appendChild(errDiv);

    const footer=el("div",{className:"flex-between",style:{marginTop:"24px"}});
    const back=el("button",{className:"btn-ghost"});back.textContent="\u2190 Back";
    back.addEventListener("click",()=>{step=2;render();});
    const confirm=el("button",{className:"btn"});confirm.textContent="Confirm Booking \u2713";
    confirm.addEventListener("click",async()=>{
      if(!form.name||!form.email||!form.player||!form.level){
        const e=document.getElementById("err-msg");
        if(e){e.textContent="Please fill in all required fields.";e.style.display="block";}
        return;
      }
      confirm.disabled=true;confirm.textContent="Booking...";
      try{
        await sb("bookings",{method:"POST",body:JSON.stringify({session_type:session,date,time,parent_name:form.name,email:form.email,phone:form.phone,player_name:form.player,player_age:form.age,level:form.level,notes:form.notes,status:"pending"})});
        await sb("availability?date=eq."+date+"&time=eq."+encodeURIComponent(time)+"&session_type=eq."+session,{method:"PATCH",body:JSON.stringify({is_available:false})});
        step=4;render();
      }catch(e){
        confirm.disabled=false;confirm.textContent="Confirm Booking \u2713";
        const err=document.getElementById("err-msg");
        if(err){err.textContent="Something went wrong. Please try again.";err.style.display="block";}
      }
    });
    footer.appendChild(back);footer.appendChild(confirm);
    wrap.appendChild(footer);
    return wrap;
  }

  function renderConfirm(){
    const sess=SESSIONS.find(s=>s.id===session);
    const wrap=el("div",{style:{textAlign:"center",padding:"40px 20px"}});
    const ball=el("div",{className:"bounce",style:{fontSize:"4rem",marginBottom:"16px"}});ball.textContent="\u26bd";
    const h=el("div",{className:"bebas",style:{fontSize:"2.8rem",letterSpacing:"0.1em",color:"#C9A84C",marginBottom:"8px"}});h.textContent="You\u2019re Booked!";
    const p=el("p",{style:{color:"#aaa",fontSize:"0.95rem",marginBottom:"32px"}});p.textContent="Cruz will reach out within 24 hours to confirm your session and share location details.";
    const box=el("div",{className:"confirm-box"});
    box.innerHTML="<div class=\"bebas\" style=\"font-size:0.7rem;letter-spacing:0.15em;color:#C9A84C;margin-bottom:12px\">SESSION DETAILS</div><div style=\"font-size:0.9rem;color:#ddd;line-height:2\">\ud83d\udc64 "+form.player+" ("+form.level+")<br>\ud83d\udccb "+(sess?sess.label:"")+"<br>\ud83d\udcc5 "+fmtDateLong(date)+" at "+time+"<br>\ud83d\udcb0 "+(sess?sess.price:"")+"</div>";
    const another=el("button",{className:"btn-ghost",style:{marginTop:"28px"}});another.textContent="Book Another Session";
    another.addEventListener("click",()=>{step=1;session=null;date=null;time=null;form={name:"",email:"",phone:"",player:"",age:"",level:"",notes:""};render();});
    wrap.appendChild(ball);wrap.appendChild(h);wrap.appendChild(p);
    const center=el("div",{style:{display:"flex",justifyContent:"center",marginBottom:"20px"}});center.appendChild(box);
    wrap.appendChild(center);wrap.appendChild(another);
    return wrap;
  }

  render();
}

// ── ADMIN APP ─────────────────────────────────────────────
function AdminApp(){
  let authed=false,pin="",pinError=false,tab="availability";
  let availability=[],bookings=[],saving=false,selectedType="private",msg=null;
  const dates=getDates(0,28);
  const app=document.getElementById("app");

  function showMsg(type,text){msg={type,text};render();setTimeout(()=>{msg=null;render();},2500);}

  async function loadData(){
    const ds=dates.map(toDateStr);
    try{
      [availability,bookings]=await Promise.all([
        sb("availability?date=in.("+ds.join(",")+")"+"&select=*&order=date,time"),
        sb("bookings?select=*&order=created_at.desc&limit=50")
      ]);
    }catch(e){console.error(e);}
    render();
  }

  function isOn(date,time,type){return availability.some(a=>a.date===date&&a.time===time&&a.session_type===type&&a.is_available);}

  async function toggleSlot(date,time,type){
    if(saving)return;saving=true;
    const ex=availability.find(a=>a.date===date&&a.time===time&&a.session_type===type);
    try{
      if(ex){
        await sb("availability?id=eq."+ex.id,{method:"PATCH",body:JSON.stringify({is_available:!ex.is_available})});
        ex.is_available=!ex.is_available;
      }else{
        const r=await sb("availability",{method:"POST",body:JSON.stringify({date,time,session_type:type,is_available:true})});
        availability.push(r[0]);
      }
    }catch(e){showMsg("error","Save failed.");}
    saving=false;render();
  }

  async function addAll(date,type){
    if(saving)return;saving=true;
    try{
      for(const time of TIMES){
        const ex=availability.find(a=>a.date===date&&a.time===time&&a.session_type===type);
        if(!ex){const r=await sb("availability",{method:"POST",body:JSON.stringify({date,time,session_type:type,is_available:true})});availability.push(r[0]);}
        else if(!ex.is_available){await sb("availability?id=eq."+ex.id,{method:"PATCH",body:JSON.stringify({is_available:true})});ex.is_available=true;}
      }
      showMsg("success","All slots opened!");
    }catch(e){showMsg("error","Save failed.");}
    saving=false;render();
  }

  async function clearDay(date,type){
    if(saving)return;saving=true;
    try{
      const toClose=availability.filter(a=>a.date===date&&a.session_type===type&&a.is_available);
      for(const s of toClose){await sb("availability?id=eq."+s.id,{method:"PATCH",body:JSON.stringify({is_available:false})});s.is_available=false;}
      showMsg("success","Day cleared.");
    }catch(e){showMsg("error","Save failed.");}
    saving=false;render();
  }

  async function updateStatus(id,status){
    try{
      await sb("bookings?id=eq."+id,{method:"PATCH",body:JSON.stringify({status})});
      const b=bookings.find(b=>b.id===id);if(b)b.status=status;render();
    }catch(e){console.error(e);}
  }

  function render(){
    app.innerHTML="";
    if(!authed){renderPin();return;}
    renderAdminUI();
  }

  function renderPin(){
    const screen=el("div",{className:"pin-screen"});
    const card=el("div",{className:"pin-card"});
    const ball=el("div",{style:{fontSize:"2.5rem",marginBottom:"12px"}});ball.textContent="\u26bd";
    const h=el("div",{className:"bebas",style:{fontSize:"1.6rem",letterSpacing:"0.1em",color:"#C9A84C",marginBottom:"4px"}});h.textContent="CRUZ CONTROL";
    const sub=el("div",{style:{fontSize:"0.75rem",color:"#666",letterSpacing:"0.15em",marginBottom:"28px"}});sub.textContent="COACH ADMIN";
    const inp=el("input",{type:"password",className:"pin-input"+(pinError?" error":""),placeholder:"Enter PIN"});
    inp.value=pin;
    inp.addEventListener("input",e=>{pin=e.target.value;pinError=false;});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin();});
    const errMsg=el("div",{style:{color:"#ff8080",fontSize:"0.82rem",marginBottom:"12px",display:pinError?"block":"none"}});errMsg.textContent="Wrong PIN. Try again.";
    const btn=el("button",{className:"btn",style:{width:"100%"}});btn.textContent="SIGN IN";
    btn.addEventListener("click",tryLogin);
    card.appendChild(ball);card.appendChild(h);card.appendChild(sub);card.appendChild(inp);card.appendChild(errMsg);card.appendChild(btn);
    screen.appendChild(card);app.appendChild(screen);
    setTimeout(()=>{const i=app.querySelector(".pin-input");if(i)i.focus();},50);
  }

  function tryLogin(){if(pin===ADMIN_PIN){authed=true;render();loadData();}else{pinError=true;render();}}

  function renderAdminUI(){
    const pendingCount=bookings.filter(b=>b.status==="pending").length;
    app.appendChild(el("div",{className:"admin-header"},[
      el("div",{style:{display:"flex",alignItems:"center",gap:"12px"}},[
        el("div",{className:"logo-circle",style:{width:"36px",height:"36px",fontSize:"1.1rem"}},["\u26bd"]),
        el("div",{},[
          el("div",{className:"bebas",style:{fontSize:"1.2rem",letterSpacing:"0.1em",color:"#C9A84C"}},["CCC COACH PANEL"]),
          el("div",{style:{fontSize:"0.65rem",color:"#555",letterSpacing:"0.12em"}},["CRUZ GUZMAN"])
        ])
      ]),
      (()=>{const b=el("button",{style:{background:"transparent",border:"1px solid rgba(255,255,255,0.1)",borderRadius:"6px",padding:"6px 14px",color:"#888",fontSize:"0.75rem",cursor:"pointer",fontFamily:"'Bebas Neue',sans-serif",letterSpacing:"0.08em"}});b.textContent="SIGN OUT";b.addEventListener("click",()=>{authed=false;render();});return b;})()
    ]));

    const tabBar=el("div",{className:"tab-bar"});
    const t1=el("button",{className:"tab"+(tab==="availability"?" active":"")});t1.textContent="\ud83d\udcc5 My Availability";t1.addEventListener("click",()=>{tab="availability";render();});
    const t2=el("button",{className:"tab"+(tab==="bookings"?" active":"")});
    t2.innerHTML="\ud83d\udccb Bookings"+(pendingCount>0?"<span style=\"background:#C9A84C;color:#0a0f1e;border-radius:10px;padding:1px 7px;font-size:0.7rem;margin-left:6px\">"+pendingCount+"</span>":"");
    t2.addEventListener("click",()=>{tab="bookings";render();});
    tabBar.appendChild(t1);tabBar.appendChild(t2);app.appendChild(tabBar);

    if(msg){
      const m=el("div",{className:"msg-bar msg-"+msg.type});m.textContent=msg.text;app.appendChild(m);
    }

    const main=el("div",{className:"main",style:{maxWidth:"720px"}});
    if(tab==="availability")main.appendChild(renderAvailTab());
    else main.appendChild(renderBookingsTab());
    app.appendChild(main);
  }

  function renderAvailTab(){
    const wrap=el("div",{});
    const h=el("div",{className:"bebas",style:{fontSize:"1.6rem",letterSpacing:"0.08em",marginBottom:"6px"}});h.textContent="Set Your Open Slots";
    const p=el("p",{style:{color:"#888",fontSize:"0.85rem",marginBottom:"20px"}});p.textContent="Tap a time to open or close it. Gold = open for booking.";
    wrap.appendChild(h);wrap.appendChild(p);

    const toggle=el("div",{className:"type-toggle"});
    ["private","group"].forEach(t=>{
      const btn=el("button",{className:"type-btn"+(selectedType===t?" active":"")});
      btn.textContent=t==="private"?"\u26bd Private":"\ud83d\udc65 Group";
      btn.addEventListener("click",()=>{selectedType=t;render();});
      toggle.appendChild(btn);
    });
    wrap.appendChild(toggle);

    dates.slice(0,14).forEach(d=>{
      const ds=toDateStr(d);
      const openCount=TIMES.filter(t=>isOn(ds,t,selectedType)).length;
      const card=el("div",{className:"day-card"});
      const hrow=el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}});
      const dname=el("div",{});
      const dn=el("span",{className:"bebas",style:{fontSize:"1rem",letterSpacing:"0.06em",color:"#f0ede6"}});
      dn.textContent=d.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
      const cnt=el("span",{style:{marginLeft:"10px",fontSize:"0.72rem",color:openCount>0?"#C9A84C":"#555"}});
      cnt.textContent=openCount+" slot"+(openCount!==1?"s":"")+" open";
      dname.appendChild(dn);dname.appendChild(cnt);
      const btns=el("div",{style:{display:"flex",gap:"6px"}});
      const allOn=el("button",{className:"small-btn small-btn-gold"});allOn.textContent="ALL ON";allOn.addEventListener("click",()=>addAll(ds,selectedType));
      const clr=el("button",{className:"small-btn small-btn-grey"});clr.textContent="CLEAR";clr.addEventListener("click",()=>clearDay(ds,selectedType));
      btns.appendChild(allOn);btns.appendChild(clr);
      hrow.appendChild(dname);hrow.appendChild(btns);
      card.appendChild(hrow);
      const slots=el("div",{style:{display:"flex",flexWrap:"wrap",gap:"6px"}});
      TIMES.forEach(t=>{
        const sb2=el("button",{className:"slot-btn"+(isOn(ds,t,selectedType)?" on":"")});
        sb2.textContent=t;
        sb2.addEventListener("click",()=>toggleSlot(ds,t,selectedType));
        slots.appendChild(sb2);
      });
      card.appendChild(slots);wrap.appendChild(card);
    });
    return wrap;
  }

  function renderBookingsTab(){
    const wrap=el("div",{});
    const h=el("div",{className:"bebas",style:{fontSize:"1.6rem",letterSpacing:"0.08em",marginBottom:"6px"}});h.textContent="Incoming Bookings";
    const p=el("p",{style:{color:"#888",fontSize:"0.85rem",marginBottom:"20px"}});p.textContent="Most recent first. Update status as you confirm sessions.";
    wrap.appendChild(h);wrap.appendChild(p);
    if(bookings.length===0){
      const empty=el("div",{className:"empty-box"});
      empty.innerHTML="<div style=\"font-size:2rem;margin-bottom:12px\">\ud83d\udccb</div><div class=\"bebas\" style=\"font-size:1.1rem;color:#C9A84C;margin-bottom:6px\">No Bookings Yet</div><p style=\"color:#888;font-size:0.85rem\">Once clients book sessions, they\'ll appear here.</p>";
      wrap.appendChild(empty);
      return wrap;
    }
    bookings.forEach(b=>{
      const card=el("div",{className:"booking-card",style:{borderColor:b.status==="confirmed"?"rgba(80,200,120,0.2)":b.status==="cancelled"?"rgba(255,80,80,0.15)":"rgba(255,255,255,0.07)"}});
      const topRow=el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px",flexWrap:"wrap",gap:"8px"}});
      const nameDiv=el("div",{});
      const pname=el("div",{className:"bebas",style:{fontSize:"1.05rem",color:"#f0ede6",marginBottom:"2px"}});
      pname.textContent=b.player_name+" ";
      const lvl=el("span",{style:{color:"#888",fontSize:"0.85rem",fontFamily:"'Source Serif 4',serif",fontWeight:"normal"}});lvl.textContent="("+b.level+")";
      pname.appendChild(lvl);
      const parent=el("div",{style:{fontSize:"0.8rem",color:"#aaa"}});parent.textContent="Parent: "+b.parent_name+" \u00b7 "+b.email+(b.phone?" \u00b7 "+b.phone:"");
      nameDiv.appendChild(pname);nameDiv.appendChild(parent);
      const statusDiv=el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}});
      const badge=el("span",{className:"badge badge-"+b.status});badge.textContent=b.status;
      const sel=el("select",{className:"status-select"});
      ["pending","confirmed","cancelled"].forEach(s=>{const o=el("option");o.value=s;o.textContent=s.charAt(0).toUpperCase()+s.slice(1);sel.appendChild(o);});
      sel.value=b.status;
      sel.addEventListener("change",e=>updateStatus(b.id,e.target.value));
      statusDiv.appendChild(badge);statusDiv.appendChild(sel);
      topRow.appendChild(nameDiv);topRow.appendChild(statusDiv);
      card.appendChild(topRow);
      const details=el("div",{style:{display:"flex",gap:"16px",flexWrap:"wrap",fontSize:"0.82rem",marginBottom:"8px"}});
      const st=el("span",{style:{color:"#C9A84C"}});st.textContent="\ud83d\udccb "+(b.session_type==="private"?"Private Training":"Group Session");
      const dt=el("span",{style:{color:"#ccc"}});dt.textContent="\ud83d\udcc5 "+fmtDate(b.date)+" at "+b.time;
      details.appendChild(st);details.appendChild(dt);
      if(b.player_age){const ag=el("span",{style:{color:"#888"}});ag.textContent="Age "+b.player_age;details.appendChild(ag);}
      card.appendChild(details);
      if(b.notes){const n=el("div",{style:{background:"rgba(255,255,255,0.03)",borderRadius:"6px",padding:"8px 12px",fontSize:"0.8rem",color:"#999",fontStyle:"italic",marginBottom:"8px"}});n.textContent="\""+b.notes+"\"";card.appendChild(n);}
      const ts=el("div",{style:{fontSize:"0.7rem",color:"#555"}});ts.textContent="Booked "+new Date(b.created_at).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
      card.appendChild(ts);
      wrap.appendChild(card);
    });
    return wrap;
  }

  render();
}

// ── ROUTER ────────────────────────────────────────────────
if(window.location.pathname==="/admin"||window.location.search.includes("admin")){AdminApp();}
else{BookingApp();}
</script>
